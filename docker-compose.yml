version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: farmsphere
      POSTGRES_USER: farmsphere
      POSTGRES_PASSWORD: farmsphere
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
    env_file: .env.example
